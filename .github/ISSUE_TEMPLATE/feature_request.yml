---
name: Feature request
description: Suggest tooling, sequencing, docs, or safety improvements
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Summarize macOS context (version, Apple Silicon vs Intel)
        and the targeted bundle.

        Separate **`install/`** package work from **`config/`**
        defaults and session tweaks.

        Read **CONTRIBUTING.md** before submitting.

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What changes and intended outcome?
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Problem / rationale
      description: What gap exists today?
    validations:
      required: true

  - type: dropdown
    id: bundle
    attributes:
      label: Primary surface
      options:
        - install/ (Homebrew, installers, clones)
        - config/ (defaults write, dotfiles, shell)
        - docs / tooling / CI / unit tests
        - submodule dotfiles consumed here
      default: 0

  - type: textarea
    id: footprint
    attributes:
      label: Constraints (optional)
      description: >
        Offline installs, Apple Silicon vs Intel, or CI notes.
      render: plaintext
    validations:
      required: false
